<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f6f7f4;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1b2a1f;">
    <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px;">
      <h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;">{{ title }}</h1>
      <p style="margin:0 0 16px;font-size:15px;line-height:1.6;">{{ message }}</p>
      {% if admin_message %}
        <div style="margin:0 0 16px;padding:16px;border-left:3px solid #15803d;background:#f3f8f4;">
          <p style="margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:0.04em;color:#4b5f52;">
            A note from the MarketLink team
          </p>
          <p style="margin:0;font-size:15px;line-height:1.6;white-space:pre-line;">{{ admin_message }}</p>
        </div>
      {% endif %}
      <p style="margin:0 0 24px;font-size:15px;line-height:1.6;">
        <a href="{{ action_url }}" style="color:#15803d;">Review what this affects</a>
      </p>
      <p style="margin:0;font-size:13px;color:#6b7b70;">MarketLink</p>
    </div>
  </body>
</html>
