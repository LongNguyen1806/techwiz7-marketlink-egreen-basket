name: MarketLink DevSecOps & CI/CD Pipeline

on:
  push:
    branches: [ LongNguyen_dev, main ]
  pull_request:
    branches: [ LongNguyen_dev, main ]

jobs:
  # ==============================================================================
  # GATE 1: SECRET SCANNING (Chống lộ API Key / Credentials)
  # ==============================================================================
  secret-scan:
    name: 🔒 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Security Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==============================================================================
  # GATE 2: BACKEND SAST & SECURITY AUDIT (Python 3.14)
  # ==============================================================================
  backend-security-and-checks:
    name: 🛡️ Backend SAST & Dependency Audit (Python 3.14)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Dependencies & Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: 🔍 SAST Security Scan with Bandit (OWASP Python)
        run: |
          bandit -r . -x ./tests,./venv,./staticfiles --severity-level medium

      - name: 📦 Scan Python Dependencies for Known CVEs (pip-audit)
        run: |
          pip-audit -r requirements.txt
        continue-on-error: true

      - name: ⚙️ Django System Integrity Check
        run: |
          python manage.py check

      - name: 🗄️ Verify Database Migration Consistency
        run: |
          python manage.py makemigrations --check --dry-run

  # ==============================================================================
  # GATE 3: FRONTEND SECURITY AUDIT & VITE BUILD (Node 22)
  # ==============================================================================
  frontend-security-and-build:
    name: ⚛️ Frontend Security Audit & Vite Build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: 📦 Frontend Dependency Vulnerability Audit (npm audit)
        run: |
          npm audit --audit-level=high

      - name: 🚀 Build Production Bundle
        run: npm run build
